name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a sibling's change that breaks this repository shows the next morning
  # rather than at the next push here.  The seven repositories' crons are staggered,
  # libraries first: ooxml-common 02:07, ooxml-edit 02:17, pptx2svg 02:37, docx2svg 02:47,
  # pptx-agent 03:07, docx-agent 03:17, xlsx-agent 03:27 (UTC).  The whole matrix, as a
  # push runs it.
  schedule:
    - cron: "27 3 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every Python the package claims, as the siblings test (ROADMAP.md's R0 asks only
        # for 3.11 and 3.15; the full range costs little and keeps the four repositories alike).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.11 to 3.14.
          allow-prereleases: true

      - name: Install
        # The siblings are not on PyPI yet, so they are installed from their repositories
        # first and `pip install -e .[test]` then finds the requirements already satisfied.
        # They are @main, so a sibling change this repository depends on lands there first.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          # TEMPORARY (r25k): ooxml-edit 0.73.0 from its branch until DatasetEntry.also is merged; back to @main then
          python -m pip install "ooxml-edit @ git+https://github.com/uvrt/ooxml-edit@datasets-also-r25"
          # Test only: a deck filled from a workbook's table (tests/test_sources_deck.py).
          python -m pip install "pptx2svg @ git+https://github.com/uvrt/pptx2svg@main"
          python -m pip install "pptx-agent @ git+https://github.com/uvrt/pptx-agent@main"
          python -m pip install -e .[test]

      # A docstring's invalid escape ("\h") is a SyntaxWarning (3.12+; a DeprecationWarning
      # before), printed once at the first compile and easy to miss: fail on it here.
      - name: Compile with syntax warnings as errors
        run: python -W error::SyntaxWarning -W error::DeprecationWarning -m compileall -q -f src tests

      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names: the tag workflow tags that version when it reaches main.
      - name: The version agrees with CHANGELOG.md
        run: python tools/check_version.py
      # Lint and type check: the same versions as pyproject.toml's dev extra (change both
      # together); what they check is configured there.  ruff takes a few bug-finding
      # rules (pyflakes and the like), never formatting.
      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.2"
          ruff check .
      # mypy, not strict, over the package: ooxml-common and ooxml-edit installed as the
      # test job installs them, so their types are used where they ship py.typed.
      - name: Type check (mypy)
        run: |
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          # TEMPORARY (r25k): ooxml-edit 0.73.0 from its branch until DatasetEntry.also is merged; back to @main then
          python -m pip install "ooxml-edit @ git+https://github.com/uvrt/ooxml-edit@datasets-also-r25"
          python -m pip install "mypy==2.4.0"
          mypy

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
