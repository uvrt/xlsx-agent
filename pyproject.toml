[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx-agent"
version = "0.1.2"
description = "Workbooks as a source an agent can describe, query and derive from, every figure traceable to its cells"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Evert Koks" }]
keywords = ["xlsx", "excel", "spreadsheet", "ooxml", "agent", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Text Processing :: Markup :: XML",
]
# lxml, ooxml-edit and ooxml-common, and nothing else at runtime; why each, and why at its
# version: CHANGELOG.md, "Dependencies".
dependencies = ["lxml>=4.9", "ooxml-edit>=0.57.0", "ooxml-common>=0.29.0"]

[project.optional-dependencies]
# pptx-agent (and pptx2svg, which its layout checks measure text with) for the tests only:
# a deck filled from a workbook's table in one session (tests/test_sources_deck.py).
test = ["pytest>=7", "pptx-agent", "pptx2svg>=0.2.0"]

[project.urls]
Repository = "https://github.com/uvrt/xlsx-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Excel oracle drives the real Microsoft Excel for Mac, one instance per machine; opt in
# with `pytest -m oracle` (tests/oracle.py).
addopts = "-m 'not oracle'"
markers = ["slow: a long measurement, run with --run-slow",
           "provider: calls a model provider's API online; skipped without its API key",
           "oracle: drives Microsoft Excel for Mac (one instance per machine); skips when Excel is in use"]
